<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3efe9">
  <meta name="description" content="Cocomoto recording catalogue. Independent recordings.">
  <title>COCOMOTO — Independent Recordings</title>
  <style>
    :root { --paper:#f3efe9; --ink:#35353a; --muted:#777570; --line:#c5c0b9; --pink:#eba8ce; --rose:#95677b; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:Arial,Helvetica,sans-serif; -webkit-font-smoothing:antialiased; }
    a { color:inherit; }
    .page { width:min(100% - 44px, 920px); margin:0 auto; padding:28px 0 30px; }
    .masthead { text-align:center; padding:0 0 23px; border-bottom:1px solid var(--line); }
    .brand { display:block; font-family:Arial,Helvetica,sans-serif; font-style:normal; font-size:clamp(23px,3vw,28px); line-height:1.1; font-weight:700; letter-spacing:-.035em; text-decoration:none; }
    .masthead-sub { display:block; margin-top:6px; font-size:10px; text-transform:uppercase; letter-spacing:.075em; color:var(--rose); }
    .catalogue { padding-top:32px; }
    .release { display:grid; grid-template-columns:minmax(0, 400px) minmax(0,1fr); gap:clamp(30px,5vw,64px); align-items:stretch; border-bottom:1px solid var(--line); padding:0 0 32px; }
    .artwork { width:100%; min-width:0; }
    .sleeve { display:block; width:100%; height:auto; aspect-ratio:1/1; max-width:400px; object-fit:contain; }
    .release-copy { min-width:0; position:relative; display:flex; flex-direction:column; justify-content:center; align-items:stretch; padding:9px 0; }
    .index-label { font-size:10px; text-transform:uppercase; letter-spacing:.15em; color:var(--rose); margin-bottom:7px; }
    .catalog-no { position:absolute; bottom:0; right:0; font-size:12px; letter-spacing:.10em; color:var(--rose); font-weight:600; }
    .track { font-family:Arial,Helvetica,sans-serif; font-size:18px; line-height:1.25; font-weight:700; margin:0 0 5px; text-transform:none; }
    .details { font-size:13px; color:var(--muted); line-height:1.6; margin:0 0 21px; }
    .player { width:100%; max-width:375px; }
    .player iframe { width:100%; height:42px; display:block; border:0; }
    .links { display:flex; flex-wrap:wrap; gap:10px 23px; margin-top:16px; }
    .links a, .footer a { text-decoration:none; }
    .links a { font-size:11px; text-transform:uppercase; letter-spacing:.1em; border-bottom:1px solid var(--pink); padding-bottom:4px; }
    a:hover { color:var(--rose); }
    .footer { margin-top:24px; display:flex; justify-content:space-between; gap:12px 24px; flex-wrap:wrap; align-items:center; text-transform:uppercase; letter-spacing:.11em; font-size:10px; color:var(--muted); }
    .footer-links { display:flex; flex-wrap:wrap; gap:20px; }
    .footer-links a { border-bottom:1px solid transparent; padding-bottom:3px; }
    .footer-links a:hover { border-bottom-color:var(--pink); }
    @media (max-width:680px) {
      .page { width:min(100% - 36px,480px); padding-top:22px; }
      .masthead { padding-bottom:20px; }
      .catalogue { padding-top:22px; }
      .release { grid-template-columns:minmax(0,1fr); gap:23px; padding-bottom:30px; }
      .sleeve { max-width:100%; }
      .release-copy { padding:0 0 30px; min-height:225px; justify-content:flex-start; }
      .details { margin-bottom:19px; }
      .footer { align-items:flex-start; line-height:1.8; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <a class="brand" href="./" aria-label="Cocomoto home">COCOMOTO</a>
      <span class="masthead-sub">Independent Recordings</span>
    </header>
    <main class="catalogue" aria-label="Cocomoto recording catalogue">
      <article class="release" aria-labelledby="track-001">
        <div class="artwork"><img class="sleeve" src="assets/ccm-001.jpg" alt="The Reasons — original Cocomoto cover artwork" width="2048" height="2048"></div>
        <div class="release-copy">
          <div class="index-label">Catalogue no. 001</div>
          <h1 class="track" id="track-001">the reasons</h1>
          <p class="details">23.10.2026</p>
          <div class="player" id="listen">
            <iframe title="The Reasons by Cocomoto — Bandcamp player" src="https://bandcamp.com/EmbeddedPlayer/track=1372958876/size=small/bgcol=f3efe9/linkcol=95677b/transparent=true/" loading="lazy" allow="autoplay" referrerpolicy="strict-origin-when-cross-origin"><a href="https://cocomoto.bandcamp.com/track/the-reasons">Listen on Bandcamp</a></iframe>
          </div>
          <nav class="links" aria-label="Release links">
            <a href="https://cocomoto.bandcamp.com/track/the-reasons" target="_blank" rel="noopener noreferrer">Bandcamp</a>
            <a href="https://distrokid.com/hyperfollow/cocomoto/the-reasons" target="_blank" rel="noopener noreferrer">Streaming</a>
          </nav>
          <div class="catalog-no">CCM.001</div>
        </div>
      </article>
    </main>
    <footer class="footer">
      <span>Recording catalogue</span>
      <nav class="footer-links" aria-label="Site links">
        <a href="https://distrokid.com/hyperfollow/cocomoto/the-reasons" target="_blank" rel="noopener noreferrer">Listen</a>
        <a href="https://cocomoto.bandcamp.com/" target="_blank" rel="noopener noreferrer">Bandcamp</a>
        <a href="mailto:cocomotomusic@gmail.com">Contact</a>
      </nav>
    </footer>
  </div>
</body>
</html>
